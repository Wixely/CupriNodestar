<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CupriNet</title>
  <style>
    :root { color-scheme: light dark; --fg:#e8e8ea; --dim:#9a9aa2; --bg:#141416; --accent:#9d86ff; }
    body { margin:0; background:var(--bg); color:var(--fg);
           font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    header { padding:.9rem 1rem; border-bottom:1px solid #2c2c33; display:flex; gap:.75rem; align-items:baseline; }
    h1 { font-size:.95rem; margin:0; color:var(--accent); letter-spacing:.02em; }
    .dim { color:var(--dim); font-size:.8rem; }
    #viewport { display:block; width:100%; height:60vh; background:#0e0e11; }
    #log { padding:.75rem 1rem; margin:0; white-space:pre-wrap; word-break:break-word;
           color:var(--dim); font-size:.78rem; max-height:30vh; overflow:auto; }
  </style>
</head>
<body>
  <header>
    <h1>CupriNet</h1>
    <span class="dim">the page is clearnet; everything below arrives over WebRTC</span>
  </header>

  <!-- CupriFace paints the fetched site here. It is a canvas rather than a DOM subtree because the renderer draws
       HTML and CSS itself â€” no browser engine, and no JavaScript engine for a hostile site to reach for. -->
  <canvas id="viewport"></canvas>

  <pre id="log"></pre>

  <script>
    // The module writes progress to stdout; surfacing it in the page means a failed handshake is visible without
    // opening devtools, which matters because most of what can go wrong here is invisible otherwise.
    const log = document.getElementById('log');
    const write = (line) => { log.textContent += line + '\n'; log.scrollTop = log.scrollHeight; };

    const canvas = document.getElementById('viewport');
    const dpr = window.devicePixelRatio || 1;
    canvas.width = canvas.clientWidth * dpr;
    canvas.height = canvas.clientHeight * dpr;

    var Module = {
      canvas: canvas,
      print: write,
      printErr: write,
      onAbort: (why) => write('[cupri] aborted: ' + why),

      // Nothing keeps the module alive once main() returns, and main returns immediately by design — the managed
      // side is pumped from here rather than blocking the browser's only thread.
      noExitRuntime: true,

      onRuntimeInitialized: function () {
        // The pump. Managed continuations are queued, not run inline, so the browser stays responsive between
        // frames and the promise chains that complete the WebRTC handshake actually get to run.
        const tick = Module._cupri_tick;
        if (!tick) { write('[cupri] cupri_tick missing — the module cannot be driven'); return; }
        write('[cupri] runtime up, pump started');
        (function frame() { tick(); requestAnimationFrame(frame); })();
      },
    };

    // Fetch the node's signed link, then load the module. Order matters: the module reads the seed synchronously on
    // startup, so it must already be here. This is the last HTTP request the page makes â€” everything after it is
    // WebRTC.
    fetch('intonation.json', { cache: 'no-store' })
      .then((r) => r.json())
      .then((d) => {
        Module.cupriSeed = d.link;
        write('[cupri] seed received (' + d.link.length + ' chars)');
        const s = document.createElement('script');
        s.src = 'CupriNet.Nodestar.Client.js';
        document.body.appendChild(s);
      })
      .catch((e) => write('[cupri] could not read the seed link: ' + e));
  </script>
</body>
</html>
