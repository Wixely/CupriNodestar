<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CupriNet</title>
  <style>
    :root { color-scheme: light dark; --fg:#e8e8ea; --dim:#9a9aa2; --bg:#141416; --accent:#9d86ff; }
    body { margin:0; background:var(--bg); color:var(--fg);
           font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    header { padding:.7rem 1rem; border-bottom:1px solid #2c2c33; display:flex; gap:.75rem; align-items:center;
             flex-wrap:wrap; }
    h1 { font-size:.95rem; margin:0; color:var(--accent); letter-spacing:.02em; }
    .dim { color:var(--dim); font-size:.8rem; }
    #go { display:flex; gap:.4rem; flex:1 1 22rem; }
    #link { flex:1; min-width:0; background:#0e0e11; color:var(--fg); border:1px solid #2c2c33; border-radius:6px;
            padding:.35rem .6rem; font:inherit; font-size:.78rem; }
    #link:focus { outline:none; border-color:var(--accent); }
    #go button { background:var(--accent); color:#141416; border:0; border-radius:6px; padding:.35rem .9rem;
                 font:inherit; font-size:.78rem; font-weight:700; cursor:pointer; }
    #back { padding:.3rem .6rem; border-radius:.4rem; border:1px solid #2a2a33; background:#17171c; color:inherit;
            font:inherit; font-size:.9rem; line-height:1; cursor:pointer; }
    #back:disabled { opacity:.35; cursor:default; }
    #viewport { display:block; width:100%; height:60vh; background:#0e0e11; }
    #log { padding:.75rem 1rem; margin:0; white-space:pre-wrap; word-break:break-word;
           color:var(--dim); font-size:.78rem; max-height:30vh; overflow:auto; }
  </style>
</head>
<body>
  <!--
    Client CHROME. Everything in this header is written by the client and never by a site: the site paints into the
    canvas below and nothing else. A site that could write here could claim to be a node it is not, which is the
    address-bar spoofing problem imported wholesale.
  -->
  <header>
    <h1>CupriNet</h1>
    <!-- Back is CHROME, like everything else in this header. A site cannot press it and cannot hide it: history is
         the client's record of where the visitor has been, and handing a site any influence over it would let a
         page trap someone on itself. Disabled until there is somewhere to go, so it never lies about being able to. -->
    <button id="back" type="button" title="Back" disabled>&#8592;</button>
    <form id="go">
      <!-- A LINK, not a bare cupri1… address. A Signet names a site but does not say where to reach it; in v1 the
           address travels with its reachability inside the link. Resolving a bare address to a moving host is L1
           roaming, which does not exist yet — so this asks for what actually works. -->
      <input id="link" type="text" spellcheck="false" autocomplete="off"
             placeholder="cuprinet://intone/… — paste a node's link to visit it">
      <button type="submit">Go</button>
    </form>
    <span class="dim" id="status">starting…</span>
  </header>

  <!-- CupriFace paints the fetched site here. A canvas rather than a DOM subtree because the renderer draws HTML
       and CSS itself — no browser engine, and no JavaScript engine for a hostile site to reach for. -->
  <canvas id="viewport"></canvas>

  <!--
    The accessibility mirror.

    A canvas is opaque to a screen reader: it announces "canvas" and stops, so every site this client rendered was,
    to anyone using one, a blank page. CupriFace builds an ARIA tree from the same layout it paints, and this is
    where that tree is written so the browser's own accessibility machinery can read it.

    It is EMPTY of styling on purpose beyond being off-screen — clip-rect rather than `display:none` or
    `visibility:hidden`, both of which remove an element from the accessibility tree as well as from the page, which
    would defeat the entire point.

    aria-live is deliberately absent: this mirrors a whole document, and announcing every repaint would talk over
    the reader continuously. It is a static tree to navigate, not a stream of announcements.
  -->
  <div id="aria" role="region" aria-label="Site content"
       style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap"></div>

  <pre id="log"></pre>

  <script type="module">
    // Boot sequence modelled on CupriFace's WebLlvm host, which is CI-gated against real Chromium — the recipe is
    // proven, so this page deliberately stays close to it.
    import { dotnet } from './dotnet.js';

    const log = document.getElementById('log');
    const write = (line) => { log.textContent += line + '\n'; log.scrollTop = log.scrollHeight; };
    window.addEventListener('error', (e) => write('[page-error] ' + (e.error && e.error.stack || e.message)));
    window.addEventListener('unhandledrejection', (e) => write('[unhandled] ' + (e.reason && e.reason.stack || e.reason)));

    // The module's stdout lands on console.*; mirroring it into the page makes a failed handshake visible without
    // devtools, which matters because most of what can go wrong here is otherwise invisible.
    for (const lvl of ['log', 'info', 'warn', 'error']) {
      const orig = console[lvl].bind(console);
      console[lvl] = (...a) => { try { write(a.map(String).join(' ')); } catch {} orig(...a); };
    }

    try {
      // The bridge into module scope. imports.js reads the seed from here — under the dotnet.js loader the page
      // never owns the Module object, so a global is the seam, exactly as CupriFace's imports.js does it.
      write('[cupri] fetching seed…');
      const seedResponse = await fetch('intonation.json', { cache: 'no-store' });
      const seed = (await seedResponse.json()).link;
      // The canvas is sized in device pixels here so the engine renders at the display's real resolution rather
      // than being scaled up and blurred. imports.js reads both back through this same bridge.
      const canvas = document.getElementById('viewport');

      // The canvas has TWO sizes: the CSS box it occupies, and the pixel buffer behind it. Setting only the CSS box
      // leaves the buffer at its original size and the browser stretches it to fit — the picture blurs and the text
      // smears, which looks like a broken renderer rather than a stale buffer.
      //
      // So the buffer is resized to match the box, in real device pixels, and re-matched whenever either changes.
      // devicePixelRatio is re-read every time rather than captured: dragging a window to a monitor with a different
      // scale factor changes it without changing the element's CSS size at all.
      const sizeCanvas = () => {
        const dpr = window.devicePixelRatio || 1;
        const w = Math.max(1, Math.round(canvas.clientWidth * dpr));
        const h = Math.max(1, Math.round(canvas.clientHeight * dpr));
        // Guarded: assigning width/height CLEARS the canvas even when the value is unchanged, so an unguarded
        // assignment on every resize event would flash the page blank while dragging.
        if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
      };

      sizeCanvas();

      // ResizeObserver rather than window.onresize: the viewport is sized in vh and by its flex parent, so it can
      // change without the window doing so. The window listener stays for the monitor-scale case above, which
      // changes devicePixelRatio while the element's own box stays put.
      //
      // Neither one repaints. The wasm module notices the new buffer size on its next frame and redraws itself,
      // which keeps the resize path identical to every other repaint reason instead of a second way to draw.
      if (typeof ResizeObserver !== 'undefined') new ResizeObserver(sizeCanvas).observe(canvas);
      window.addEventListener('resize', sizeCanvas);

      // The bridge into module scope. `pending` is a hand-off the module TAKES (imports.js clears it), so one
      // submit produces exactly one visit however often the module polls.
      const status = document.getElementById('status');
      globalThis.__cupri = {
        seed,
        canvas,
        pending: '',
        // Taken by the module exactly once per press, the same hand-off `pending` uses.
        backPressed: false,
        status: (text) => { status.textContent = text; },
        seedSerial: 0,
        refreshSeed: () => {},   // replaced below; declared here so the shape is complete from the start
      };

      // Re-fetching the seed is what makes reconnecting possible at all.
      //
      // A restarted node has NEW ICE credentials and a NEW DTLS fingerprint — both are generated per process and
      // neither is persisted — so the link this page booted with is permanently dead the moment the server bounces.
      // Re-dialling it can never succeed, however patiently. Only a freshly fetched link can, and fetching is a
      // clearnet HTTP concern that belongs here rather than in the module: without Mono there is no browser HTTP
      // handler behind HttpClient, so managed code cannot do it.
      //
      // The serial lets the module tell "the server answered" from "the server is still down" without needing an
      // async call across the boundary: it only advances on a successful fetch.
      globalThis.__cupri.refreshSeed = async () => {
        try {
          const response = await fetch('intonation.json', { cache: 'no-store' });
          if (!response.ok) return;
          const fresh = (await response.json()).link;
          if (!fresh) return;
          globalThis.__cupri.seed = fresh;
          globalThis.__cupri.seedSerial++;
        } catch {
          // Expected while the node is restarting — the page is served by the very thing that is down. The module
          // backs off and asks again; there is nothing useful to report for a failure we are already retrying.
        }
      };

      const backButton = document.getElementById('back');
      backButton.addEventListener('click', () => {
        if (backButton.disabled) return;
        globalThis.__cupri.backPressed = true;
        status.textContent = 'going back…';
      });

      // Driven by the module, because only it knows what the history holds.
      globalThis.__cupri.setCanGoBack = (can) => { backButton.disabled = !can; };

      // The module offering a link back into the address bar after a visit ends.
      //
      // NEVER over what someone is typing. A suggestion that overwrites a half-pasted link is worse than no
      // suggestion, and the visitor cannot get back what it replaced.
      globalThis.__cupri.suggest = (link) => {
        const field = document.getElementById('link');
        if (!field.value.trim()) field.value = link;
      };

      document.getElementById('go').addEventListener('submit', (e) => {
        e.preventDefault();
        const field = document.getElementById('link');
        const value = field.value.trim();
        if (!value) return;
        globalThis.__cupri.pending = value;
        field.value = '';
        status.textContent = 'navigating…';
      });
      write('[cupri] seed received (' + seed.length + ' chars)');

      const runtime = await dotnet.withDiagnosticTracing(false).create();
      write('[cupri] runtime created');

      await runtime.runMain('CupriNet.Nodestar.Client', []);
      write('[cupri] main returned — pumping');

      // The pump. Main fires its work and returns; managed continuations queue in BrowserLoop and this drains them
      // once a frame, so nothing ever blocks the browser's only thread.
      const tick = runtime.Module._cupri_tick;
      if (!tick) { write('[cupri] cupri_tick missing — the module cannot be driven'); }
      else (function frame() { tick(); requestAnimationFrame(frame); })();
    } catch (err) {
      write('[cupri] boot failed: ' + (err && err.stack || err));
    }
  </script>
</body>
</html>
