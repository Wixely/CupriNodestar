name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# One run per branch. A full run is ~13 minutes and dominated by the browser job (wasm toolchain, wasm publish,
# Chromium), so three commits in quick succession otherwise means three complete pipelines racing to tell you about
# a commit that is already superseded.
#
# Tags are exempt from cancellation on purpose: a `v*` run publishes a Release, and cancelling one halfway leaves a
# partially-populated release rather than no release — the failure that is hardest to notice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# VERSION is resolved per job by the "Resolve the version" step rather than set here, because it depends on WHY the
# workflow is running and a workflow-level `env` cannot branch (GitHub expressions have no way to strip the leading
# "v" from a tag name).
#
#   ordinary push → 0.1.0-alpha.<run number>, so a hundred artifacts are not all called 0.1.0-alpha. These builds
#   exist for people to try and send back a log, and the first question about any log is "which build?".
#
#   v* tag        → the tag itself, minus the "v". Without this a release tagged v0.1.0-alpha.1 would contain
#   packages stamped 0.1.0-alpha.<run number> — a release whose name disagrees with everything inside it, which is
#   the same confusion the run number exists to prevent, only worse for being on the artifact people keep.

jobs:
  # Both solutions, both suites. Two solutions exist so a sample can take a dependency the product must not, and the
  # consequence is that building one proves nothing about the other.
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Authenticate the Wixely feed
        shell: bash
        run: |
          dotnet nuget update source GitHub-Wixely-Packages \
            --username "${{ github.actor }}" \
            --password "${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text

      - name: Resolve the version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"          # v0.1.0-alpha.1 -> 0.1.0-alpha.1
          else
            version="0.1.0-alpha.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "building version $version"

      - name: Build the product
        run: dotnet build Nodestar.slnx -c Release -p:Version=$env:VERSION

      # trx, so a failure arrives as a file someone can attach rather than a screenshot of a terminal.
      - name: Test the product
        run: dotnet test Nodestar.slnx -c Release --no-build --logger "trx;LogFileName=product.trx" --results-directory artifacts/test-results

      - name: Build the samples
        run: dotnet build samples/Samples.slnx -c Release -p:Version=$env:VERSION

      - name: Test the samples
        run: dotnet test samples/Samples.slnx -c Release --no-build --logger "trx;LogFileName=samples.trx" --results-directory artifacts/test-results

      - name: Pack
        run: dotnet pack Nodestar.slnx -c Release --no-build -p:Version=$env:VERSION -o artifacts/nuget

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/test-results

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/nuget

  # Something a person can download, unzip and run — which is the point of these builds. Mode 2 (the site served
  # over plain HTTP) needs no browser client and no wasm toolchain, so it is the example that works everywhere and
  # builds in seconds.
  example:
    # Waits for the browser job so it can take the built wasm client from it. Otherwise the example would ship with
    # an empty client bundle: Mode 2 would work, /_nodestar/app would 404, and the README in the zip would be
    # describing something the download cannot do. Building the client here instead would mean installing the wasm
    # toolchain three more times, once per RID.
    needs: browser
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, linux-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Authenticate the Wixely feed
        shell: bash
        run: |
          dotnet nuget update source GitHub-Wixely-Packages \
            --username "${{ github.actor }}" \
            --password "${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text

      - uses: actions/download-artifact@v4
        with:
          name: browser-client
          path: src/CupriNet.Nodestar.Client.CupriFace/client

      # The green-but-empty guard, and the reason this job has `needs: browser` at all.
      #
      # The bundle is an EMBEDDED RESOURCE behind a glob. If the artifact failed to arrive, or landed a directory
      # deeper than expected, the glob simply matches nothing: the publish below still succeeds, the zip still
      # builds, and the example ships with no client — /_nodestar/app 404s while every job reports success. The
      # failure this job exists to prevent would survive as a pass, which is the worst shape a CI result can take.
      #
      # dotnet.native.wasm specifically: it is the one file that cannot be produced by anything except a real wasm
      # publish, so its presence rules out a partial or stale staging as well as an absent one.
      - name: Assert the client bundle actually arrived
        shell: bash
        run: |
          dir=src/CupriNet.Nodestar.Client.CupriFace/client
          for required in dotnet.native.wasm dotnet.js index.html; do
            if [ ! -f "$dir/$required" ]; then
              echo "::error::$required is missing from $dir — the browser-client artifact did not arrive intact."
              echo "Without it the example publishes cleanly and ships with no client at all."
              ls -laR "$dir" || echo "(the directory does not exist)"
              exit 1
            fi
          done
          echo "client bundle present: $(ls -1 "$dir" | wc -l) files, $(du -sh "$dir" | cut -f1)"

      - name: Resolve the version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"          # v0.1.0-alpha.1 -> 0.1.0-alpha.1
          else
            version="0.1.0-alpha.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "building version $version"

      # Self-contained: no .NET install required to try it. That matters for "download this and tell me what happens" —
      # a runtime prerequisite is the step where most people stop.
      - name: Publish the Constellation example
        run: |
          dotnet publish samples/Constellation/Constellation.csproj -c Release \
            -r ${{ matrix.rid }} --self-contained true \
            -p:Version=${{ env.VERSION }} \
            -o artifacts/example-${{ matrix.rid }}

      - name: Include the instructions beside the binary
        run: cp samples/Constellation/README.md artifacts/example-${{ matrix.rid }}/README.md

      - uses: actions/upload-artifact@v4
        with:
          name: constellation-${{ matrix.rid }}
          path: artifacts/example-${{ matrix.rid }}

  # Mode 1 in a real browser: dial, Pilgrimage, Oracle fetch, render, live update. Every failure in that chain is
  # SILENT — a stripped export, a trimmed binder, a missing font, an uncleared background all produce a page that
  # loads and shows nothing. Nothing throws, so nothing else catches them.
  browser:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install the wasm toolchain
        run: dotnet workload install wasm-tools

      - name: Authenticate the Wixely feed
        shell: bash
        run: |
          dotnet nuget update source GitHub-Wixely-Packages \
            --username "${{ github.actor }}" \
            --password "${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text

      - name: Publish the browser client
        run: dotnet publish clients/web/CupriNet.Nodestar.Client.csproj -c Release

      # Staged, THEN built: the bundle is an embedded resource, so building before staging embeds the previous one.
      - name: Stage it into the client package
        shell: bash
        run: |
          mkdir -p src/CupriNet.Nodestar.Client.CupriFace/client
          cp -f clients/web/bin/Release/net10.0/browser-wasm/publish/* src/CupriNet.Nodestar.Client.CupriFace/client/

      - name: Build the gate
        run: dotnet build tests/CupriNet.Nodestar.BrowserTests/CupriNet.Nodestar.BrowserTests.csproj -c Release

      - name: Install Chromium
        shell: pwsh
        run: tests/CupriNet.Nodestar.BrowserTests/bin/Release/net10.0/playwright.ps1 install chromium --with-deps

      - name: Run the gate
        env:
          CUPRI_DIAGNOSTICS: ${{ github.workspace }}/artifacts/browser-diagnostics
        run: dotnet test tests/CupriNet.Nodestar.BrowserTests/CupriNet.Nodestar.BrowserTests.csproj -c Release --no-build --logger "trx;LogFileName=browser.trx" --results-directory artifacts/test-results

      # Always: a screenshot of what the page looked like plus both logs — the client's and the node's. Without this
      # a failure on someone else's machine is a bare assertion message about a chain that lives inside a wasm
      # module in a headless browser.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-diagnostics
          path: |
            artifacts/browser-diagnostics
            artifacts/test-results

      # The staged bundle, so a Mode-1 example can be assembled without the wasm toolchain.
      - uses: actions/upload-artifact@v4
        with:
          name: browser-client
          path: clients/web/bin/Release/net10.0/browser-wasm/publish

  # The CupriFace boundary, enforced rather than asserted.
  #
  # PackagingBoundaryTests checks that no project under src/ or node/ REFERENCES CupriFace. This is the stronger
  # version: restore the server-side projects into an isolated package directory and fail if a renderer lands there,
  # which catches a transitive arrival a project-file scan cannot see.
  #
  # A node serving its site over Tor or a Cloudflare tunnel carries no UI runtime. That is a claim the README makes;
  # this is what makes it true.
  cupriface-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Authenticate the Wixely feed
        shell: bash
        run: |
          # CupriFace lives on the same feed as CupriNet.*, so the feed cannot simply be removed. The check is done
          # by restoring into an ISOLATED package directory and inspecting what actually landed in it.
          dotnet nuget update source GitHub-Wixely-Packages \
            --username "${{ github.actor }}" \
            --password "${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text

      - name: Restore the server-side projects in isolation
        run: |
          dotnet restore src/CupriNet.Nodestar/CupriNet.Nodestar.csproj --packages boundary-packages
          dotnet restore src/CupriNet.Nodestar.WebRtc/CupriNet.Nodestar.WebRtc.csproj --packages boundary-packages
          dotnet restore src/CupriNet.Nodestar.Tor/CupriNet.Nodestar.Tor.csproj --packages boundary-packages
          dotnet restore node/cuprinet-nodestar/cuprinet-nodestar.csproj --packages boundary-packages

      - name: Assert no UI runtime was restored
        shell: bash
        run: |
          if ls boundary-packages | grep -i '^cupriface'; then
            echo "::error::CupriFace was restored while building the node, transport and reference host."
            echo "Those must carry no UI runtime: a site served over Tor or a Cloudflare tunnel ships no renderer."
            echo "See design/nodestar.md — 'CupriFace is a preference of this project, not a requirement'."
            exit 1
          fi
          echo "server-side restore is CupriFace-free ($(ls boundary-packages | wc -l) packages, none of them a renderer)"

      - name: Build them from that graph alone
        run: |
          dotnet build src/CupriNet.Nodestar/CupriNet.Nodestar.csproj -c Release --no-restore
          dotnet build src/CupriNet.Nodestar.WebRtc/CupriNet.Nodestar.WebRtc.csproj -c Release --no-restore
          dotnet build src/CupriNet.Nodestar.Tor/CupriNet.Nodestar.Tor.csproj -c Release --no-restore
          dotnet build node/cuprinet-nodestar/cuprinet-nodestar.csproj -c Release --no-restore

  # A prerelease GitHub Release on a v* tag, carrying the runnable examples and the packages.
  #
  # Prerelease is not modesty: nothing here has been consumed by anyone, the deploy story is unfinished (TODO.md),
  # and the package shape changed recently enough that it should not be treated as settled.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, example, browser, cupriface-boundary]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloaded

      - name: Zip each example
        run: |
          mkdir -p release
          for dir in downloaded/constellation-*; do
            [ -d "$dir" ] || continue
            (cd "$dir" && zip -qr "../../release/$(basename "$dir")-${GITHUB_REF_NAME}.zip" .)
          done
          cp downloaded/packages/*.nupkg release/ 2>/dev/null || true
          ls -la release

      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: release/*
          generate_release_notes: true
          body: |
            **Prerelease.** Working end to end, not yet consumable — see [TODO.md](TODO.md).

            The `constellation-*` zips are self-contained: unzip and run, no .NET install needed. They serve the
            example site over plain HTTP (Mode 2), which works everywhere. Start it, open the address it prints, and
            if something goes wrong the console output is the useful thing to send back.
